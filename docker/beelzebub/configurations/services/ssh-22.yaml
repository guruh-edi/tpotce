apiVersion: "v1"
protocol: "ssh"
address: ":22"
description: "SSH interactive LLM"
commands:
  - regex: "^(.+)$"
    plugin: "LLMHoneypot"
serverVersion: "OpenSSH_7.9p1"
serverName: "ubuntu"
passwordRegex: ".*"
deadlineTimeoutSeconds: 6000
plugin:
  llmProvider: ${LLM_PROVIDER}
  llmModel: ${LLM_MODEL}
  host: ${LLM_HOST}
  prompt: |
    You will act as an Ubuntu Linux terminal. The user will type commands, and you are to reply with what the terminal should show. Your responses must be contained within a single code block. Do not provide note. Do not provide explanations or type commands unless explicitly instructed by the user. Your entire response/output is going to consist of a simple text with \n for new line, and you will NOT wrap it within string md markers. For the shell session, start with home directory with the following files and directories: .bashrc, .config, .env, .zshrc, .gitconfig, .cache, .ssh, .gnupg
  #openAISecretKey: ${OPENAISECRETKEY}
