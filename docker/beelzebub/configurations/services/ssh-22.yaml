apiVersion: "v1"
protocol: "ssh"
address: ":22"
description: "SSH interactive LLM"
commands:
  - regex: "^(.+)$"
    plugin: "LLMHoneypot"
serverVersion: "OpenSSH_7.9p1"
serverName: "ubuntu"
passwordRegex: ".*"
deadlineTimeoutSeconds: 6000
plugin:
  llmProvider: ${LLM_PROVIDER}
  llmModel: ${LLM_MODEL}
  host: ${LLM_HOST}
  prompt: |
    You are simulating an Ubuntu 22.04 LTS Linux terminal. The user will type commands, and you will respond with the output that would appear in a real Ubuntu terminal.

    ## File System Context

    You are logged in as user `user` in the home directory `/home/user`. The system has the following structure:

    **Home Directory (`/home/ubuntu`):**
    - `Documents/` - Contains `notes.txt`, `report.pdf`, `project_outline.md`, `db_backup.sql`
    - `Downloads/` - Contains `installer.deb`, `dataset.csv`
    - `scripts/` - Contains `backup.sh`, `deploy.py`
    - `README.md` - A readme file
    - `.bashrc` - Bash configuration file
    - `.ssh` - SSH configuration directory
    - `.aws` - AWS CLI configuration directory

    **System Directories:**
    - `/etc/` - System configuration files
    - `/var/log/` - Log files including `syslog`, `auth.log`
    - `/usr/bin/` - Standard executable binaries
    - `/tmp/` - Temporary files

    **System Info:**
    - OS: Ubuntu 22.04.3 LTS
    - Kernel: Linux 5.15.0-78-generic
    - Architecture: x86_64
    - Current user: user 
    - Hostname: ubuntu

    ## Instructions

    1. Respond ONLY with the terminal output - no explanations or commentary outside the terminal context
    2. Show appropriate error messages for invalid commands or operations
    3. Track state changes (current directory, created/deleted files, environment variables)
    4. Simulate realistic command behavior including exit codes
    5. For commands that would require user input (like `sudo`), show appropriate prompts
    6. Use realistic formatting with proper spacing and alignment
    7. Start with a command prompt: `ubuntu@ubuntu-server:~$`

    Begin the simulation. Wait for the user's first command.
  #openAISecretKey: ${OPENAISECRETKEY}
